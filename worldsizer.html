<script type="text/markdown" id="info">
name: World Sizer
description: >
  What does the world look like if we size countries by population, GDP, emissions, or another measurement?
github: worldsizer
pass_on_request: ['state']
blog: 2016/1021
</script>

<style>
    .worldsizer-stage {
        max-width: 900px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #d6d6d6;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    .worldsizer-canvas-wrap {
        background: #7785c0;
    }

    #worldmap {
        display: block;
        width: 100%;
        height: auto;
    }

    .worldsizer-controls {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 18px;
        align-items: end;
        padding: 18px 20px;
    }

    .worldsizer-field label,
    .worldsizer-density span {
        display: block;
        margin-bottom: 6px;
        color: #777;
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    #measurement {
        width: 100%;
        padding: 10px 38px 10px 12px;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        background: #fff;
        color: #424242;
        font: inherit;
    }

    .worldsizer-density label {
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 12px;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        cursor: pointer;
    }

    .worldsizer-density input {
        accent-color: #f73859;
    }

    .worldsizer-meta {
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin: 14px 0 38px;
        color: #777;
        font-size: 14px;
    }

    .worldsizer-meta a {
        color: inherit;
    }

    .worldsizer-results {
        max-width: 900px;
    }

    .worldsizer-results h2 {
        margin: 0 0 18px;
        font-size: 24px;
    }

    #lowest-highest {
        width: 100%;
        overflow: hidden;
        background: #fff;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        border-collapse: separate;
        border-spacing: 0;
    }

    #lowest-highest th,
    #lowest-highest td {
        padding: 10px 14px;
        border-bottom: 1px solid #e5e5e5;
        text-align: left;
    }

    #lowest-highest th {
        background: #f9f9f9;
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    #lowest-highest tr:last-child td {
        border-bottom: 0;
    }

    #lowest-highest td:nth-child(2),
    #lowest-highest td:nth-child(4) {
        font-family: 'Geist Mono', monospace;
        text-align: right;
    }

    @media (max-width: 640px) {
        .worldsizer-stage {
            border-radius: 8px;
        }

        .worldsizer-controls {
            grid-template-columns: 1fr;
            padding: 14px;
        }

        .worldsizer-meta {
            margin-bottom: 30px;
        }

        #lowest-highest th,
        #lowest-highest td {
            padding: 8px;
            font-size: 13px;
        }
    }
</style>

<script src="{% static "projects/worldsizer/cartogram-player.js" %}"></script>

<div class="worldsizer-stage">
    <div class="worldsizer-canvas-wrap">
        <canvas id="worldmap" width="720" height="540" aria-label="Cartogram of the world"></canvas>
    </div>
    <div class="worldsizer-controls">
        <div class="worldsizer-field">
            <label for="measurement">Size countries by</label>
            <select id="measurement">
                <option value="Area">Area</option>
                <option value="Population">Population</option>
                <option value="Carbon Emissions">CO2 emissions</option>
                <option value="Army Size">Active army size</option>
                <option value="GDP (official exchange rate)">GDP (exchange rate)</option>
                <option value="Living with Aids">Living with AIDS</option>
                <option value="Exports">Exports</option>
                <option value="Alcohol Consumption">Alcohol consumption</option>
                <option value="Labor force">Labor force</option>
                <option value="Olympic Medals">Olympic medals won</option>
            </select>
        </div>
        <div class="worldsizer-density">
            <span>Adjustment</span>
            <label><input type="checkbox" id="correct-density" checked> Compensate for population density</label>
        </div>
    </div>
</div>

<div class="worldsizer-meta">
    <span id="worldsizer-status">Geographic area</span>
    <span><a href="https://en.wikipedia.org/wiki/Mollweide_projection">Mollweide projection</a></span>
</div>

<div class="worldsizer-results">
    <h2>Largest and smallest</h2>
    <table id="lowest-highest">
        <thead><tr><th colspan="2">Largest</th><th colspan="2">Smallest</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    async function initializeWorldSizer() {
        const staticRoot = '{% static "projects/worldsizer/" %}';
        const [geometryResponse, pathsResponse, measurementsResponse] = await Promise.all([
            fetch(staticRoot + 'geometry.json'),
            fetch(staticRoot + 'measurement_paths.json'),
            fetch(staticRoot + 'measurements.json')
        ]);
        if (![geometryResponse, pathsResponse, measurementsResponse].every(response => response.ok)) {
            throw new Error('One or more cartogram files could not be loaded');
        }
        const geometry = await geometryResponse.json();
        const pathData = await pathsResponse.json();
        const measurements = await measurementsResponse.json();
        if (geometry.version !== pathData.geometry) {
            throw new Error('Measurement frames use incompatible geometry');
        }

        const player = new CartogramPlayer(document.getElementById('worldmap'), geometry, {
            fit: true,
            margin: 75
        });
        const paths = new Map();
        const countryNames = new Map(geometry.countries.map(country => [country.cc, country.name]));
        const select = document.getElementById('measurement');
        const density = document.getElementById('correct-density');
        const status = document.getElementById('worldsizer-status');
        let currentKey = 'Area';
        let changing = false;
        player.draw();

        function keyFor(field) {
            return field === 'Area' ? field : field + (density.checked ? ':density' : '');
        }

        function pathFor(key) {
            if (!paths.has(key)) {
                paths.set(key, CartogramPlayer.decodePath(
                    pathData.paths[key], geometry.points, pathData.scale
                ));
            }
            return paths.get(key);
        }

        function updateTable(field) {
            const rows = Object.entries(measurements)
                .filter(([, values]) => typeof values[field] === 'number' && values[field] > 1)
                .map(([countryCode, values]) => [countryNames.get(countryCode) || values.Iso2, values[field]])
                .sort((left, right) => right[1] - left[1]);
            const body = document.querySelector('#lowest-highest tbody');
            body.replaceChildren();
            for (let index = 0; index < Math.min(5, Math.floor(rows.length / 2)); index++) {
                const row = document.createElement('tr');
                const values = [rows[index][0], rows[index][1], rows[rows.length - 1 - index][0], rows[rows.length - 1 - index][1]];
                for (const value of values) {
                    const cell = document.createElement('td');
                    cell.textContent = typeof value === 'number' ? Math.round(value).toLocaleString() : value;
                    row.appendChild(cell);
                }
                body.appendChild(row);
            }
        }

        async function changeMeasurement() {
            if (changing) return;
            const field = select.value;
            const targetKey = keyFor(field);
            if (targetKey === currentKey) return;
            changing = true;
            select.disabled = true;
            density.disabled = true;
            status.textContent = 'Calculating transition…';

            const sequence = [];
            if (currentKey !== 'Area') {
                sequence.push(...pathFor(currentKey).slice(0, -1).reverse(), geometry.points);
            }
            if (targetKey !== 'Area') sequence.push(...pathFor(targetKey));
            await player.animateSequence(sequence, 110);
            currentKey = targetKey;
            status.textContent = field === 'Area' ? 'Geographic area' : 'Area represents ' + select.options[select.selectedIndex].text.toLowerCase();
            updateTable(field);
            history.replaceState({state: field}, '', '?state=' + encodeURIComponent(field));
            select.disabled = false;
            density.disabled = false;
            changing = false;
        }

        select.addEventListener('change', changeMeasurement);
        density.addEventListener('change', changeMeasurement);
        updateTable('Area');

        const initialState = '{{ state|default:"Area"|escapejs }}';
        if (Array.from(select.options).some(option => option.value === initialState)) {
            select.value = initialState;
            if (initialState !== 'Area') await changeMeasurement();
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        initializeWorldSizer().catch(error => {
            console.error(error);
            const status = document.getElementById('worldsizer-status');
            status.textContent = 'Unable to load the cartogram data';
            status.setAttribute('role', 'alert');
        });
    });
</script>
