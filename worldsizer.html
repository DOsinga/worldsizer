<script type="text/markdown" id="info">
name: World Sizer
description: >
  What does the world look like if we size countries by population, GDP, emissions, or another measurement?
github: worldsizer
pass_on_request: ['state']
blog: 2016/1021
</script>

<style>
    .worldsizer-stage {
        max-width: 900px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #d6d6d6;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    .worldsizer-canvas-wrap {
        background: #7785c0;
    }

    #worldmap {
        display: block;
        width: 100%;
        height: auto;
    }

    .worldsizer-controls {
        padding: 18px 20px;
    }

    .worldsizer-field {
        margin: 0;
        padding: 0;
        border: 0;
    }

    .worldsizer-field legend {
        display: block;
        margin-bottom: 6px;
        color: #777;
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .worldsizer-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .worldsizer-options button {
        min-height: 44px;
        padding: 9px 12px;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        background: #fff;
        color: #424242;
        font: inherit;
        text-align: left;
        cursor: pointer;
    }

    .worldsizer-options button:hover:not(:disabled) {
        border-color: #999;
        background: #f9f9f9;
    }

    .worldsizer-options button[aria-pressed="true"] {
        border-color: #f73859;
        background: #f73859;
        color: #fff;
    }

    .worldsizer-options button:focus-visible {
        outline: 3px solid rgba(247, 56, 89, 0.28);
        outline-offset: 2px;
    }

    .worldsizer-options button:disabled {
        cursor: wait;
        opacity: 0.7;
    }

    .worldsizer-meta {
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin: 14px 0 38px;
        color: #777;
        font-size: 14px;
    }

    .worldsizer-meta a {
        color: inherit;
    }

    .worldsizer-results {
        max-width: 900px;
    }

    .worldsizer-results h2 {
        margin: 0 0 18px;
        font-size: 24px;
    }

    #lowest-highest {
        width: 100%;
        overflow: hidden;
        background: #fff;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        border-collapse: separate;
        border-spacing: 0;
    }

    #lowest-highest th,
    #lowest-highest td {
        padding: 10px 14px;
        border-bottom: 1px solid #e5e5e5;
        text-align: left;
    }

    #lowest-highest th {
        background: #f9f9f9;
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    #lowest-highest tr:last-child td {
        border-bottom: 0;
    }

    #lowest-highest td:nth-child(2),
    #lowest-highest td:nth-child(4) {
        font-family: 'Geist Mono', monospace;
        text-align: right;
    }

    @media (max-width: 640px) {
        .worldsizer-stage {
            border-radius: 8px;
        }

        .worldsizer-controls {
            padding: 14px;
        }

        .worldsizer-meta {
            margin-bottom: 30px;
        }

        #lowest-highest th,
        #lowest-highest td {
            padding: 8px;
            font-size: 13px;
        }
    }
</style>

<script src="{% static "projects/worldsizer/cartogram-player.js" %}"></script>

<div class="worldsizer-stage">
    <div class="worldsizer-canvas-wrap">
        <canvas id="worldmap" width="720" height="540" aria-label="Cartogram of the world"></canvas>
    </div>
    <div class="worldsizer-controls">
        <fieldset class="worldsizer-field">
            <legend>Size countries by</legend>
            <div class="worldsizer-options">
                <button type="button" data-measurement="Population" aria-pressed="true" disabled>Population</button>
                <button type="button" data-measurement="CO2 emissions" aria-pressed="false" disabled>CO2 emissions</button>
                <button type="button" data-measurement="Armed forces" aria-pressed="false" disabled>Armed forces personnel</button>
                <button type="button" data-measurement="GDP" aria-pressed="false" disabled>GDP</button>
                <button type="button" data-measurement="People living with HIV" aria-pressed="false" disabled>People living with HIV</button>
                <button type="button" data-measurement="Exports" aria-pressed="false" disabled>Exports</button>
                <button type="button" data-measurement="Alcohol consumption" aria-pressed="false" disabled>Alcohol consumption</button>
                <button type="button" data-measurement="Labor force" aria-pressed="false" disabled>Labor force</button>
                <button type="button" data-measurement="Olympic medals" aria-pressed="false" disabled>Olympic medals won</button>
                <button type="button" data-measurement="Oil production" aria-pressed="false" disabled>Oil production</button>
                <button type="button" data-measurement="Forest area" aria-pressed="false" disabled>Forest area</button>
                <button type="button" data-measurement="Area" aria-pressed="false" disabled>Area</button>
            </div>
        </fieldset>
    </div>
</div>

<div class="worldsizer-meta">
    <span>
        <span id="worldsizer-status">Area represents population</span>
        <span aria-hidden="true"> · </span>
        <a id="measurement-source" href="https://data.worldbank.org/indicator/SP.POP.TOTL">World Bank</a>
        <span id="measurement-year">2025</span>
    </span>
    <span><a href="https://en.wikipedia.org/wiki/Mollweide_projection">Mollweide projection</a></span>
</div>

<div class="worldsizer-results">
    <h2>Top 10 largest and smallest</h2>
    <table id="lowest-highest">
        <thead><tr><th colspan="2">Largest</th><th colspan="2">Smallest</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    async function initializeWorldSizer() {
        const staticRoot = '{% static "projects/worldsizer/" %}';
        const [geometryResponse, initialResponse] = await Promise.all([
            fetch(staticRoot + 'geometry.json'),
            fetch(staticRoot + 'initial_population.json')
        ]);
        if (!geometryResponse.ok || !initialResponse.ok) {
            throw new Error('The initial cartogram could not be loaded');
        }
        const geometry = await geometryResponse.json();
        const initial = await initialResponse.json();
        if (geometry.version !== initial.geometry) {
            throw new Error('The initial cartogram uses incompatible geometry');
        }

        const player = new CartogramPlayer(document.getElementById('worldmap'), geometry, {
            fit: true,
            margin: 75
        });
        player.setPoints(CartogramPlayer.scaledPoints(initial.points, initial.scale));
        await new Promise(resolve => requestAnimationFrame(resolve));

        const [pathsResponse, measurementsResponse] = await Promise.all([
            fetch(staticRoot + 'measurement_paths.json'),
            fetch(staticRoot + 'measurements.json')
        ]);
        if (!pathsResponse.ok || !measurementsResponse.ok) {
            throw new Error('The cartogram data could not be loaded');
        }
        const pathData = await pathsResponse.json();
        const measurements = await measurementsResponse.json();
        if (geometry.version !== pathData.geometry) {
            throw new Error('Measurement frames use incompatible geometry');
        }

        const paths = new Map();
        const measurementMetadata = new Map(pathData.measurements.map(item => [item.id, item]));
        const countryNames = new Map(geometry.countries.map(country => [country.cc, country.name]));
        const buttons = Array.from(document.querySelectorAll('[data-measurement]'));
        const status = document.getElementById('worldsizer-status');
        let currentKey = 'Population';
        let changing = false;

        function pathFor(key) {
            if (!paths.has(key)) {
                paths.set(key, CartogramPlayer.decodePath(
                    pathData.paths[key], geometry.points, pathData.scale
                ));
            }
            return paths.get(key);
        }

        function buttonFor(field) {
            return buttons.find(button => button.dataset.measurement === field);
        }

        function selectMeasurement(field) {
            for (const button of buttons) {
                button.setAttribute('aria-pressed', button.dataset.measurement === field);
            }
        }

        function updateTable(field) {
            const rows = Object.entries(measurements)
                .filter(([, values]) => typeof values[field] === 'number' && values[field] > 1)
                .map(([countryCode, values]) => [countryNames.get(countryCode) || values.Iso2, values[field]])
                .sort((left, right) => right[1] - left[1]);
            const body = document.querySelector('#lowest-highest tbody');
            body.replaceChildren();
            for (let index = 0; index < Math.min(10, Math.floor(rows.length / 2)); index++) {
                const row = document.createElement('tr');
                const values = [rows[index][0], rows[index][1], rows[rows.length - 1 - index][0], rows[rows.length - 1 - index][1]];
                for (const value of values) {
                    const cell = document.createElement('td');
                    cell.textContent = typeof value === 'number' ? Math.round(value).toLocaleString() : value;
                    row.appendChild(cell);
                }
                body.appendChild(row);
            }
        }

        function updateMetadata(field) {
            const metadata = measurementMetadata.get(field);
            const source = document.getElementById('measurement-source');
            source.textContent = metadata.source;
            if (metadata.sourceUrl) source.href = metadata.sourceUrl;
            else source.removeAttribute('href');
            document.getElementById('measurement-year').textContent = metadata.year;
        }

        async function changeMeasurement(field) {
            if (changing) return;
            if (field === currentKey) return;
            changing = true;
            selectMeasurement(field);
            for (const button of buttons) button.disabled = true;
            status.textContent = 'Calculating transition…';

            const sequence = [];
            if (currentKey !== 'Area') {
                sequence.push(...pathFor(currentKey).slice(0, -1).reverse(), geometry.points);
            }
            if (field !== 'Area') sequence.push(...pathFor(field));
            await player.animateSequence(sequence, 110);
            currentKey = field;
            status.textContent = field === 'Area' ? 'Geographic area' : 'Area represents ' + buttonFor(field).textContent.toLowerCase();
            updateTable(field);
            updateMetadata(field);
            history.replaceState({state: field}, '', '?state=' + encodeURIComponent(field));
            for (const button of buttons) button.disabled = false;
            changing = false;
        }

        for (const button of buttons) {
            button.addEventListener('click', () => changeMeasurement(button.dataset.measurement));
        }
        updateTable('Population');

        const initialState = '{{ state|default:"Population"|escapejs }}';
        for (const button of buttons) button.disabled = false;
        if (buttonFor(initialState)) {
            if (initialState !== 'Population') await changeMeasurement(initialState);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        initializeWorldSizer().catch(error => {
            console.error(error);
            const status = document.getElementById('worldsizer-status');
            status.textContent = 'Unable to load the cartogram data';
            status.setAttribute('role', 'alert');
        });
    });
</script>
